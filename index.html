<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Coach — AI-Powered TikTok Insights</title>
    <meta name="description" content="Creator Coach uses AI to turn your TikTok data into actionable insights that help you grow faster.">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --tiktok-pink: #FE2C55;
            --tiktok-cyan: #25F4EE;
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow::before,
        .bg-glow::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }

        .bg-glow::before {
            width: 600px;
            height: 600px;
            background: var(--tiktok-pink);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-glow::after {
            width: 500px;
            height: 500px;
            background: var(--tiktok-cyan);
            bottom: -150px;
            left: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Particle canvas */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 24px;
        }

        /* Title */
        .title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            margin-top: 32px;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-primary) 40%, var(--tiktok-cyan) 60%, var(--tiktok-pink) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleEntry 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards, shimmer 6s ease-in-out infinite 1.5s;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes titleEntry {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Tagline */
        .tagline {
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            color: var(--text-secondary);
            margin-top: 16px;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Waitlist form */
        .waitlist {
            margin-top: 48px;
            display: flex;
            gap: 12px;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .waitlist input {
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            width: 280px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .waitlist input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .waitlist input:focus {
            border-color: var(--tiktok-cyan);
            box-shadow: 0 0 20px rgba(37, 244, 238, 0.15);
        }

        .waitlist button {
            padding: 14px 28px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--tiktok-pink), #ff6b8a);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        .waitlist button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(254, 44, 85, 0.4);
        }

        .waitlist button:active {
            transform: translateY(0);
        }

        /* Success message */
        .success-msg {
            margin-top: 16px;
            color: var(--tiktok-cyan);
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
        }

        .success-msg.visible {
            opacity: 1;
        }

        /* Stats bar */
        .stats {
            display: flex;
            gap: 40px;
            margin-top: 56px;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--tiktok-cyan), var(--tiktok-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 2;
            padding: 24px;
            text-align: center;
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
            margin: 0 16px;
        }

        footer a:hover {
            color: var(--text-primary);
        }

        footer .separator {
            color: rgba(255, 255, 255, 0.15);
        }

        /* Responsive */
        @media (max-width: 540px) {
            .waitlist {
                flex-direction: column;
                width: 100%;
                max-width: 320px;
            }

            .waitlist input {
                width: 100%;
            }

            .waitlist button {
                width: 100%;
                text-align: center;
            }

            .stats {
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <canvas id="particles"></canvas>

    <div class="container">
        <h1 class="title">Creator Coach</h1>
        <p class="tagline">AI-powered insights from your TikTok data — so you know exactly what to post next.</p>

        <form class="waitlist" id="waitlistForm">
            <input type="email" placeholder="Enter your email" required id="emailInput" autocomplete="email">
            <button type="submit">Join Waitlist</button>
        </form>
        <p class="success-msg" id="successMsg">You're on the list! We'll be in touch soon.</p>

        <div class="stats">
            <div class="stat">
                <div class="stat-number">AI</div>
                <div class="stat-label">Powered</div>
            </div>
            <div class="stat">
                <div class="stat-number">TikTok</div>
                <div class="stat-label">Analytics</div>
            </div>
            <div class="stat">
                <div class="stat-number">10x</div>
                <div class="stat-label">Smarter Content</div>
            </div>
        </div>
    </div>

    <footer>
        <a href="https://drive.google.com/file/d/1huvOlwky331LnY2_O9IHF_J2QPRZXBFu/view?usp=drive_link" target="_blank" rel="noopener">Terms of Service</a>
        <span class="separator">|</span>
        <a href="https://drive.google.com/file/d/1LQeDnsap4zosGfGV8tvp5vX7JTiX7dIm/view?usp=drive_link" target="_blank" rel="noopener">Privacy Policy</a>
    </footer>

    <script>
        // Floating particles
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.4 + 0.1;
                this.color = Math.random() > 0.5 ? '254,44,85' : '37,244,238';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color},${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Waitlist form — submit to Google Forms
        document.getElementById('waitlistForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const msg = document.getElementById('successMsg');
            const btn = this.querySelector('button');

            btn.disabled = true;
            btn.textContent = 'Submitting...';

            const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLScq02S-gx8fAE4SNPGygUfG3dKMCUguOc6xPruEHb034SQ32Q/formResponse';
            const formData = new URLSearchParams();
            formData.append('entry.799071913', email);

            fetch(formUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            }).then(() => {
                msg.classList.add('visible');
                document.getElementById('emailInput').value = '';
                setTimeout(() => msg.classList.remove('visible'), 4000);
            }).catch(() => {
                msg.textContent = 'Something went wrong. Please try again.';
                msg.style.color = '#FE2C55';
                msg.classList.add('visible');
                setTimeout(() => {
                    msg.classList.remove('visible');
                    msg.textContent = "You're on the list! We'll be in touch soon.";
                    msg.style.color = '';
                }, 4000);
            }).finally(() => {
                btn.disabled = false;
                btn.textContent = 'Join Waitlist';
            });
        });
    </script>
</body>
</html>
